name: Controller / Deep Reviewer PASS

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  deep-review:
    name: Controller / Deep Reviewer PASS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposed fix
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: npm install

      - name: Controller preflight
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-unknown}" != "main"
          test -f backend/index.ts
          test -f server/auth.ts
          test -f server/appdeployCompat.ts
          test -f api/index.js
          test -f scripts/deep-review-backend-auth.mjs
          ! grep -R "from '@appdeploy/sdk'" backend src server api package.json --exclude-dir=node_modules
          ! grep -R "from '@appdeploy/client'" backend src server api package.json --exclude-dir=node_modules
          echo 'CONTROLLER PREFLIGHT: PASS'

      - name: Independent Deep Reviewer
        run: node scripts/deep-review-backend-auth.mjs

      - name: Gate result
        shell: bash
        run: |
          set -euo pipefail
          echo 'CONTROLLER DECISION: APPROVED'
          echo 'DEEP REVIEW: PASS'
          echo 'MERGE TO MAIN: ELIGIBLE ONLY AFTER THIS REQUIRED CHECK PASSES'
