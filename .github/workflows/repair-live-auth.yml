name: Repair live auth flow
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply live auth fixes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path

          api = Path('server/apiEntrypoint.ts')
          s = api.read_text()
          old = """async function isLfaAdmin(userId?: string) {
            if (!userId) return false;
            const result = await db.list<RecordShape>('user_roles', { limit: 5000 });
            return result.items.some(item => String(item.userId) === userId && String(item.role) === 'LFA Admin');
          }
          """
          new = """async function isLfaAdmin(userId?: string) {
            if (!userId) return false;
            const result = await db.list<RecordShape>('user_roles', { limit: 5000 });
            return result.items.some(item => String(item.userId) === userId && String(item.role) === 'LFA Admin');
          }

          async function isMatchOperator(userId?: string) {
            if (!userId) return false;
            const result = await db.list<RecordShape>('user_roles', { limit: 5000 });
            return result.items.some(item => String(item.userId) === userId && ['LFA Admin', 'Manager', 'Club Manager'].includes(String(item.role)));
          }
          """
          if old not in s:
              raise SystemExit('isLfaAdmin block not found')
          s = s.replace(old, new, 1)
          s = s.replace("pathname === '/api/live-match/events-v2' && actor && await isLfaAdmin(actor.userId)", "pathname === '/api/live-match/events-v2' && actor && await isMatchOperator(actor.userId)", 1)
          s = s.replace("if (!actor || !(await isLfaAdmin(actor.userId))) {\n      send(response, actor ? 403 : 401, { error: actor ? 'LFA Admin role required' : 'Unauthorized', code: actor ? 'forbidden' : 'not_authenticated' }, reqId);", "if (!actor || !(await isMatchOperator(actor.userId))) {\n      send(response, actor ? 403 : 401, { error: actor ? 'Match operator role required' : 'Unauthorized', code: actor ? 'forbidden' : 'not_authenticated' }, reqId);", 1)
          api.write_text(s)

          client = Path('src/platformClient.ts')
          s = client.read_text()
          s = s.replace("const API_BASE = (import.meta.env.VITE_API_BASE_URL || '').replace(/\\/$/, '');", "// Keep browser API calls same-origin so the HttpOnly pitchline_session cookie is always sent to the same Vercel host.\nconst API_BASE = '';", 1)
          client.write_text(s)

          live = Path('src/LiveMatchCentre.tsx')
          s = live.read_text()
          s = s.replace("const canManage = role === 'LFA Admin';", "const canManage = ['LFA Admin', 'Manager', 'Club Manager'].includes(role);", 1)
          live.write_text(s)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/apiEntrypoint.ts src/platformClient.ts src/LiveMatchCentre.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Fix same-origin session and manager live controls"
          git push
          rm -f .github/workflows/repair-live-auth.yml
          git add -u .github/workflows/repair-live-auth.yml
          git commit -m "Remove temporary live auth repair workflow"
          git push
