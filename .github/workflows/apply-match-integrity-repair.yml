name: Apply match integrity repair

on:
  push:
    paths:
      - scripts/apply-match-integrity-repair.mjs
      - server/matchIntegrity.ts
      - .github/workflows/apply-match-integrity-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply source repair
        run: node scripts/apply-match-integrity-repair.mjs
      - name: Validate production build
        run: npm ci && npm run build
      - name: Commit repaired source
        run: |
          git config user.name 'pitchline-integrity-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/index.ts server/matchIntegrity.ts scripts/apply-match-integrity-repair.mjs
          if git diff --cached --quiet; then
            echo 'No source changes required.'
          else
            git commit -m 'Apply match integrity repairs to production source'
            git push
          fi
