name: Repair Pitchline backend runtime

on:
  push:
    branches:
      - repair/vercel-backend-auth-migration

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore canonical backend and apply migration boundary
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show origin/main:backend/index.ts > backend/index.ts
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/index.ts')
          text = path.read_text()
          text = text.replace("from '@appdeploy/sdk'", "from '../server/appdeployCompat'", 1)
          text = text.replace("type PortalState={team:string;fixtureId:string|null;availability:string;notifications:boolean;payments:Array<Record<string,unknown>>;announcements:Array<Record<string,unknown>>};\n", "", 1)
          old = "  const visiblePlayers=assignment.role==='LFA Admin'?identity.players:assignment.role==='Club'?identity.players.filter(p=>p.clubId===assignment.clubId):assignment.role==='Manager'?identity.players.filter(p=>p.teamId===assignment.teamId):[];\n  const ids=new Set(visiblePlayers.map(p=>p.playerId));\n  const source=await buildLeagueDecisionIntelligence(userId);"
          new = "  const visiblePlayers=assignment.role==='LFA Admin'?identity.players:assignment.role==='Club'?identity.players.filter(p=>p.clubId===assignment.clubId):assignment.role==='Manager'?identity.players.filter(p=>p.teamId===assignment.teamId):[];\n  const source=await buildLeagueDecisionIntelligence(userId);"
          if old not in text:
              raise SystemExit('expected executive ids block not found')
          text = text.replace(old, new, 1)
          old = "if(old.status!=='Pending')return error('Player registration is already closed',409);let next={...old,status:requested};if(requested==='Approved'){"
          new = "if(old.status!=='Pending')return error('Player registration is already closed',409);let next:Record<string,unknown>={...old,status:requested};if(requested==='Approved'){"
          if old not in text:
              raise SystemExit('expected player registration type block not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          python - <<'PY'
          from pathlib import Path
          path = Path('server/appdeployCompat.ts')
          text = path.read_text().replace('      let result: HttpResult | void;\n', '      let result: HttpResult | void = undefined;\n', 1)
          path.write_text(text)
          PY
          git config user.name 'Pitchline Migration Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/index.ts server/appdeployCompat.ts
          if git diff --cached --quiet; then
            echo 'No backend runtime migration changes required.'
            exit 0
          fi
          git commit -m 'fix: apply canonical backend migration boundary'
          git push
