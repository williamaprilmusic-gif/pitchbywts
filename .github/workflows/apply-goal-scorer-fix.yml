name: Apply goal scorer selection fix

on:
  push:
    paths:
      - '.github/workflows/apply-goal-scorer-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch live match scorer selection
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/LiveMatchCentre.tsx')
          s = p.read_text()

          old = """function readQueue(key: string): PendingEvent[] {
  try {
    const raw = localStorage.getItem(key);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed : [];
  } catch {
    return [];
  }
}
"""
          new = old + """
function normalizeTeam(value: unknown) {
  return String(value || '').trim().toLowerCase().replace(/\\s+/g, ' ');
}
"""
          if 'function normalizeTeam(value: unknown)' not in s:
              if old not in s:
                  raise SystemExit('readQueue anchor not found')
              s = s.replace(old, new, 1)

          old_players = """  const homePlayers = useMemo(() => players.filter((player) => player.team === selected?.home), [players, selected?.home]);
  const awayPlayers = useMemo(() => players.filter((player) => player.team === selected?.away), [players, selected?.away]);
  const quickPlayers = quickTeam === selected?.home ? homePlayers : quickTeam === selected?.away ? awayPlayers : [];
"""
          new_players = """  const homePlayers = useMemo(() => players.filter((player) => normalizeTeam(player.team) === normalizeTeam(selected?.home)), [players, selected?.home]);
  const awayPlayers = useMemo(() => players.filter((player) => normalizeTeam(player.team) === normalizeTeam(selected?.away)), [players, selected?.away]);
  const quickPlayers = normalizeTeam(quickTeam) === normalizeTeam(selected?.home) ? homePlayers : normalizeTeam(quickTeam) === normalizeTeam(selected?.away) ? awayPlayers : [];
"""
          if old_players not in s:
              raise SystemExit('player filtering anchor not found')
          s = s.replace(old_players, new_players, 1)

          old_ui = """            {['Goal', 'Yellow card', 'Red card'].includes(quickType) && <><span className='step-label'>2 · PLAYER</span><div className='player-tap-grid'>{quickPlayers.map((player) => <button key={player.memberRef} className={`player-tap ${quickPlayer === player.memberRef ? 'selected' : ''}`} onClick={() => setQuickPlayer(player.memberRef)}><b>{player.number}</b><span>{player.name}</span></button>)}</div></>}
"""
          new_ui = """            {['Goal', 'Yellow card', 'Red card'].includes(quickType) && <><span className='step-label'>2 · PLAYER / GOALSCORER</span>{quickPlayers.length ? <div className='player-tap-grid'>{quickPlayers.map((player) => <button type='button' key={player.memberRef} className={`player-tap ${quickPlayer === player.memberRef ? 'selected' : ''}`} onClick={() => setQuickPlayer(player.memberRef)}><b>{player.number}</b><span>{player.name}</span></button>)}</div> : <div className='empty-state'><h3>No registered players found for {quickTeam || 'this team'}</h3><p>Register the team players first, then return to the live match.</p></div>}</>}
"""
          if old_ui not in s:
              raise SystemExit('goal scorer UI anchor not found')
          s = s.replace(old_ui, new_ui, 1)

          p.write_text(s)
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/LiveMatchCentre.tsx
          git commit -m 'Fix goal scorer player selection' || true
          git rm .github/workflows/apply-goal-scorer-fix.yml
          git commit -m 'Remove one-shot goal scorer fix workflow' || true
          git push