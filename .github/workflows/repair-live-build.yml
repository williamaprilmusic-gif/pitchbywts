name: One-shot Pitchline build repair

on:
  push:
    paths:
      - .github/workflows/repair-live-build.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove duplicate eventCounts declaration
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/LiveMatchCentre.tsx')
          text = path.read_text()
          marker = 'const eventCounts = useMemo(() => {'
          positions = [m.start() for m in re.finditer(re.escape(marker), text)]
          if len(positions) < 2:
              print(f'eventCounts declarations found: {len(positions)}; no repair needed')
          else:
              start = positions[1]
              brace = text.find('{', start)
              depth = 0
              end = None
              for i in range(brace, len(text)):
                  if text[i] == '{':
                      depth += 1
                  elif text[i] == '}':
                      depth -= 1
                      if depth == 0:
                          semi = text.find(';', i)
                          end = semi + 1 if semi >= 0 else i + 1
                          break
              if end is None:
                  raise SystemExit('Could not locate duplicate eventCounts block end')
              repaired = text[:start] + text[end:]
              path.write_text(repaired)
              print(f'Removed duplicate declaration; remaining count: {repaired.count(marker)}')
          PY
      - name: Commit repair and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/LiveMatchCentre.tsx
          git rm .github/workflows/repair-live-build.yml
          git commit -m "Fix duplicate live event declaration"
          git push
