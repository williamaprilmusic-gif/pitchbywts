name: Apply live polling fallback

on:
  push:
    paths:
      - scripts/apply-live-polling-once.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply exact frontend patch
        run: node scripts/apply-live-polling-once.mjs
      - name: Build verification
        run: npm ci && npm run build
      - name: Commit patched source and remove one-time patcher
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/LiveMatchCentre.tsx
          git rm -f scripts/apply-live-polling-once.mjs .github/workflows/apply-live-polling-once.yml
          git diff --cached --quiet || git commit -m "Add reliable live match polling fallback"
          git push
