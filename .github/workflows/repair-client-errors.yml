name: Repair live match client errors

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve live match error reporting
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/LiveMatchCentre.tsx')
          s = p.read_text()
          old = """    } catch {\n      setNotice('Could not update match state.');\n    } finally {\n      setBusy(false);\n    }\n  };"""
          new = """    } catch (error) {\n      const failure = error as Error & { code?: string; status?: number; requestId?: string };\n      const detail = [failure.message, failure.code ? `code: ${failure.code}` : '', failure.requestId ? `request: ${failure.requestId}` : ''].filter(Boolean).join(' · ');\n      setNotice(detail || 'Could not update match state.');\n      if (path === '/api/live-match/start' && failure.status === 409) {\n        await loadMatch(selected.id);\n      }\n    } finally {\n      setBusy(false);\n    }\n  };"""
          if old not in s:
              raise SystemExit('target block not found')
          p.write_text(s.replace(old, new, 1))
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/LiveMatchCentre.tsx
          git commit -m "Improve live match error diagnostics" || exit 0
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm .github/workflows/repair-client-errors.yml || true
          git commit -m "Remove temporary client repair workflow" || true
          git push || true
