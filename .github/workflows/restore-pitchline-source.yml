name: Restore Pitchline source tree

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/restore-pitchline-source.yml'
      - '**/.restore-source-marker'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-source:
    runs-on: ubuntu-latest
    if: "github.event_name == 'workflow_dispatch' || (!contains(github.event.head_commit.message, '[extract-source]') && !contains(github.event.head_commit.message, 'match integrity'))"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract AppDeploy source snapshot
        shell: bash
        run: |
          set -euo pipefail

          ZIP="grassroots-football-hub-2cjj34-1789405131274-src.zip"
          test -f "$ZIP"

          rm -rf /tmp/pitchline-source
          mkdir -p /tmp/pitchline-source
          unzip -q "$ZIP" -d /tmp/pitchline-source

          SOURCE_ROOT=""
          while IFS= read -r candidate; do
            if [ -f "$candidate/package.json" ] && [ -d "$candidate/src" ]; then SOURCE_ROOT="$candidate"; break; fi
          done < <(find /tmp/pitchline-source -type d -print)
          if [ -z "$SOURCE_ROOT" ] && [ -f "/tmp/pitchline-source/package.json" ] && [ -d "/tmp/pitchline-source/src" ]; then SOURCE_ROOT="/tmp/pitchline-source"; fi
          if [ -z "$SOURCE_ROOT" ]; then echo "Could not locate the Vite project root in the source ZIP."; exit 1; fi

          rsync -a --delete --exclude='.git/' --exclude='.github/' "$SOURCE_ROOT/" ./
          test -f src/main.tsx
          test -f package.json
          test -f index.html

      - name: Commit restored source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[extract-source] Restore complete Pitchline Vite source tree" || exit 0
          git push origin HEAD:main
