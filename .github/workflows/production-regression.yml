name: Pitchline Production Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-regression:
    name: Build / Security / Regression Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static production checks
        shell: bash
        run: |
          set -euo pipefail
          test -f backend/index.ts
          test -f server/apiEntrypoint.ts
          test -f server/auth.ts
          test -f server/appdeployCompat.ts
          test -f api/index.js
          test -f scripts/prepare-vercel-runtime.mjs
          test -f scripts/prepare-live-polling.mjs
          ! grep -R "from '@appdeploy/sdk'" backend src server api --exclude-dir=node_modules
          ! grep -R "from '@appdeploy/client'" backend src server api --exclude-dir=node_modules
          ! grep -R "authentication is not configured on Vercel yet" src server backend api --exclude-dir=node_modules
          grep -q "HttpOnly" server/auth.ts
          grep -q "createHmac" server/auth.ts
          grep -q "scryptSync" server/auth.ts
          grep -q "DATABASE_URL" server/appdeployCompat.ts

      - name: Deep review
        run: node scripts/deep-review-backend-auth.mjs

      - name: Production health check
        env:
          PITCHLINE_URL: https://pitchline-william-april.vercel.app
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error --max-time 20 "$PITCHLINE_URL/api/_healthcheck")
          echo "$response"
          node -e 'const x=JSON.parse(process.argv[1]); if(!x.ok || !x.databaseConfigured || !x.sessionConfigured || !x.adminBootstrapConfigured) process.exit(1)' "$response"

      - name: Final production build
        run: npm run build
