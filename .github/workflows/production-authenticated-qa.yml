name: Pitchline One-Click Authenticated Production QA

# Runs after Vercel reports a successful Production deployment (deployment_status
# with state == success), so the QA asserts the deploy that just went live rather
# than racing the previous one on push to main.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Production URL to test'
        required: false
        default: 'https://pitchline-william-april.vercel.app'
        type: string

permissions:
  contents: read

concurrency:
  group: pitchline-production-qa
  cancel-in-progress: true

env:
  PITCHLINE_BASE_URL: ${{ inputs.base_url || github.event.deployment_status.environment_url || 'https://pitchline-william-april.vercel.app' }}
  PITCHLINE_QA_EMAIL: ${{ secrets.PITCHLINE_QA_EMAIL }}
  PITCHLINE_QA_PASSWORD: ${{ secrets.PITCHLINE_QA_PASSWORD }}

jobs:
  authenticated-production-qa:
    name: Full authenticated production workflow
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && contains(github.event.deployment_status.environment, 'Production'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate required secrets
        run: |
          set -euo pipefail
          test -n "$PITCHLINE_QA_EMAIL" || { echo 'Missing GitHub Secret: PITCHLINE_QA_EMAIL'; exit 2; }
          test -n "$PITCHLINE_QA_PASSWORD" || { echo 'Missing GitHub Secret: PITCHLINE_QA_PASSWORD'; exit 2; }

      - name: Install QA dependencies
        run: npm ci --no-audit --no-fund

      - name: Run authenticated production QA
        run: node scripts/production-authenticated-qa.mjs

      - name: Clean automated production QA data
        if: always()
        run: node scripts/production-qa-cleanup.mjs
